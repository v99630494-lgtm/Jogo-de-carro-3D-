<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Carros 3D - Desvie ou Exploda!</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3333;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
            display: none;
            text-align: center;
        }
        #instructions {
            font-size: 18px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
    <!-- Incluindo a biblioteca Three.js para os gráficos 3D -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="ui">
        Pontuação: <span id="score">0</span>
        <div id="instructions">Use as Setas (← e →) ou A/D para mover</div>
    </div>
    
    <div id="game-over">
        BOOM! EXPLODIU!<br>
        <span style="font-size: 24px; color: white;">Reiniciando em 2 segundos...</span>
    </div>

    <script>
        // Configuração básica da cena 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Variáveis do Jogo
        let score = 0;
        let gameOver = false;
        const enemies = [];
        const laneWidth = 3;
        const lanes = [-laneWidth, 0, laneWidth];
        let speed = 0.4;
        const particles = [];

        // Criar a Pista (Estrada)
        const roadGeo = new THREE.PlaneGeometry(12, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -400;
        road.receiveShadow = true;
        scene.add(road);

        // Linhas divisórias da pista
        const lineGeo = new THREE.PlaneGeometry(0.2, 1000);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const line1 = new THREE.Mesh(lineGeo, lineMat);
        line1.rotation.x = -Math.PI / 2;
        line1.position.set(-1.5, 0.01, -400);
        scene.add(line1);

        const line2 = new THREE.Mesh(lineGeo, lineMat);
        line2.rotation.x = -Math.PI / 2;
        line2.position.set(1.5, 0.01, -400);
        scene.add(line2);

        // Função para criar um modelo simples de carro 3D
        function createCar(color) {
            const carGroup = new THREE.Group();

            // Chassi (Corpo principal)
            const bodyGeo = new THREE.BoxGeometry(1.6, 0.6, 3);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            carGroup.add(body);

            // Cabine (Teto)
            const cabinGeo = new THREE.BoxGeometry(1.4, 0.5, 1.6);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.2 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1, -0.2);
            cabin.castShadow = true;
            carGroup.add(cabin);

            // Rodas
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.4, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            
            const wheelPositions = [
                [-0.9, 0.35, 0.9],  // Frontal Esquerda
                [0.9, 0.35, 0.9],   // Frontal Direita
                [-0.9, 0.35, -0.9], // Traseira Esquerda
                [0.9, 0.35, -0.9]   // Traseira Direita
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            return carGroup;
        }

        // Criar o Carro do Jogador (Azul)
        const player = createCar(0x0066ff);
        player.position.set(0, 0, 0);
        scene.add(player);

        // Posicionar Câmera atrás do jogador
        camera.position.set(0, 4, 7);
        camera.lookAt(new THREE.Vector3(0, 1, -5));

        // Controle do Jogador
        let targetLane = 1; // 0 = Esquerda, 1 = Centro, 2 = Direita
        
        window.addEventListener('keydown', (e) => {
            if (gameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && targetLane > 0) {
                targetLane--;
            }
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && targetLane < 2) {
                targetLane++;
            }
        });

        // Função para gerar carros inimigos (Amarelos)
        function spawnEnemy() {
            if (gameOver) return;
            const enemy = createCar(0xffcc00);
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            enemy.position.set(randomLane, 0, -100);
            scene.add(enemy);
            enemies.push(enemy);

            // Agenda o próximo inimigo com tempo aleatório
            setTimeout(spawnEnemy, Math.random() * 1000 + 800);
        }
        spawnEnemy();

        // Criar efeito de explosão com partículas
        function explode(x, y, z) {
            const particleCount = 40;
            const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            
            for (let i = 0; i < particleCount; i++) {
                const mat = new THREE.MeshBasicMaterial({ 
                    color: Math.random() > 0.5 ? 0xff3300 : 0xffaa00 
                });
                const p = new THREE.Mesh(geo, mat);
                p.position.set(x, y + 0.5, z);
                
                // Vetor de velocidade aleatória
                p.userData = {
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: Math.random() * 0.4 + 0.2,
                    vz: (Math.random() - 0.5) * 0.5
                };
                
                scene.add(p);
                particles.push(p);
            }
        }

        // Função para resetar o jogo após a explosão
        function resetGame() {
            enemies.forEach(enemy => scene.remove(enemy));
            enemies.length = 0;
            particles.forEach(p => scene.remove(p));
            particles.length = 0;
            
            score = 0;
            document.getElementById('score').innerText = score;
            speed = 0.4;
            targetLane = 1;
            player.position.set(0, 0, 0);
            
            // Restaura a cor original do carro do jogador
            player.children[0].material.color.setHex(0x0066ff);
            player.visible = true;
            
            gameOver = false;
            document.getElementById('game-over').style.display = 'none';
            spawnEnemy();
        }

        // Loop de Animação Principal
        function animate() {
            requestAnimationFrame(animate);

            if (!gameOver) {
                // Movimento suave do jogador entre as pistas
                const targetX = lanes[targetLane];
                player.position.x += (targetX - player.position.x) * 0.2;

                // Atualizar e mover carros inimigos
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    enemy.position.z += speed;

                    // Detecção de Colisão por Caixa Delimitadora (AABB simples)
                    const playerBox = new THREE.Box3().setFromObject(player);
                    const enemyBox = new THREE.Box3().setFromObject(enemy);

                    // Reduz um pouco o tamanho da caixa de colisão para ser mais justo
                    playerBox.expandByScalar(-0.1);
                    enemyBox.expandByScalar(-0.1);

                    if (playerBox.intersectsBox(enemyBox)) {
                        gameOver = true;
                        document.getElementById('game-over').style.display = 'block';
                        
                        // Executa a explosão visual
                        explode(player.position.x, player.position.y, player.position.z);
                        player.children[0].material.color.setHex(0x331111); // Carro queimado
                        
                        setTimeout(resetGame, 2000);
                    }

                    // Se passou do jogador, ganha ponto e remove o carro
                    if (enemy.position.z > 10) {
