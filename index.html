<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Evita que o usuário dê zoom e que a tela quebre no celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo de Carros 3D Celular</title>
    <style>
        /* Mantém o fundo sempre escuro e fixo, sem barras pretas piscando */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            z-index: 10;
        }

        #game-over {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3333;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            display: none;
            z-index: 10;
            width: 90%;
        }

        /* BOTÕES DE TOQUE PARA O CELULAR (Estilo Joystick) */
        .controls-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 20;
        }

        .btn-control {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 35px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Evita o delay do toque no Android */
            touch-action: manipulation; 
        }

        .btn-control:active {
            background-color: rgba(255, 255, 255, 0.5);
        }
    </style>
    <!-- Biblioteca gráfica 3D -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="ui">Pontos: <span id="score">0</span></div>
    
    <div id="game-over">
        BOOM! EXPLODIU!<br>
        <span style="font-size: 18px; color: white;">Reiniciando...</span>
    </div>

    <!-- Controles visíveis na tela do celular -->
    <div class="controls-container">
        <div class="btn-control" id="btn-left">←</div>
        <div class="btn-control" id="btn-right">→</div>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Luzes
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 20, 10);
        scene.add(dirLight);

        // Variáveis do Jogo
        let score = 0;
        let gameOver = false;
        const enemies = [];
        const laneWidth = 2.5;
        const lanes = [-laneWidth, 0, laneWidth];
        let speed = 0.5;
        const particles = [];
        let targetLane = 1; 

        // Estrada
        const roadGeo = new THREE.PlaneGeometry(10, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x252525, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -400;
        scene.add(road);

        // Função simplificada para criar carros leves para celular
        function createCar(color) {
            const carGroup = new THREE.Group();
            
            // Corpo
            const bodyGeo = new THREE.BoxGeometry(1.4, 0.5, 2.6);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.4;
            carGroup.add(body);

            // Vidro / Teto
            const cabinGeo = new THREE.BoxGeometry(1.2, 0.4, 1.3);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.8, -0.1);
            carGroup.add(cabin);

            return carGroup;
        }

        // Carro do jogador (Azul)
        const player = createCar(0x0077ff);
        scene.add(player);

        camera.position.set(0, 3.5, 6);
        camera.lookAt(new THREE.Vector3(0, 0.8, -3));

        // CONTROLES DO TOQUE (Para Celular)
        document.getElementById('btn-left').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameOver && targetLane > 0) targetLane--;
        });

        document.getElementById('btn-right').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameOver && targetLane < 2) targetLane++;
        });

        // Controles do Teclado (Caso teste no PC)
        window.addEventListener('keydown', (e) => {
            if (gameOver) return;
            if (e.key === 'ArrowLeft' && targetLane > 0) targetLane--;
            if (e.key === 'ArrowRight' && targetLane < 2) targetLane++;
        });

        // Criar carros inimigos (Amarelos)
        function spawnEnemy() {
            if (gameOver) return;
            const enemy = createCar(0xffbb00);
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            enemy.position.set(randomLane, 0, -80);
            scene.add(enemy);
            enemies.push(enemy);

            setTimeout(spawnEnemy, Math.random() * 800 + 700);
        }
        spawnEnemy();

        // Efeito de Explosão
        function explode(x, y, z) {
            for (let i = 0; i < 30; i++) {
                const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const mat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff4400 : 0xffcc00 });
                const p = new THREE.Mesh(geo, mat);
                p.position.set(x, y + 0.3, z);
                p.userData = {
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: Math.random() * 0.3 + 0.2,
                    vz: (Math.random() - 0.5) * 0.4
                };
                scene.add(p);
                particles.push(p);
            }
        }

        function resetGame() {
            enemies.forEach(enemy => scene.remove(enemy));
            enemies.length = 0;
            particles.forEach(p => scene.remove(p));
            particles.length = 0;
            score = 0;
            document.getElementById('score').innerText = score;
            speed = 0.5;
            targetLane = 1;
            player.position.set(0, 0, 0);
            player.visible = true;
            gameOver = false;
            document.getElementById('game-over').style.display = 'none';
            spawnEnemy();
        }

        // Loop do Jogo
        function animate() {
            requestAnimationFrame(animate);

            if (!gameOver) {
                // Movimento do carro suavizado nas pistas
                const targetX = lanes[targetLane];
                player.position.x += (targetX - player.position.x) * 0.25;

                // Move os inimigos
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    enemy.position.z += speed;

                    // Caixa de colisão simples
                    const playerBox = new THREE.Box3().setFromObject(player);
                    const enemyBox = new THREE.Box3().setFromObject(enemy);
                    
                    playerBox.expandByScalar(-0.15); 
                    enemyBox.expandByScalar(-0.15);

                    if (playerBox.intersectsBox(enemyBox)) {
                        gameOver = true;
                        player.visible = false;
                        explode(player.position.x, player.position.y, player.position.z);
                        document.getElementById('game-over').style.display = 'block';
                        setTimeout(resetGame, 2000);
                    }

                    // Ponto quando desvia
                    if (enemy.position.z > 10) {
                        scene.remove(enemy);
                        enemies.splice(i, 1);
                        score++;
                        document.getElementById('score').innerText = score;
                        if (score % 6 === 0) speed += 0.06; // Fica mais rápido
                    }
                }
            } else {
                // Anima as partículas da explosão
                particles.forEach(p => {
                    p.position.x += p.userData.vx;
                    p.position.y += p.userData.vy;
                    p.position.z += p.userData.vz;
                    p.userData.vy -= 0.015; // Gravidade
                });
            }

            renderer.render(scene, camera);
        }

        // Ajusta a tela se virar o celular
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
